<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>SANDI AYO BELAJAR</title>
<style>
:root{--o:#ff8a00;--b:#2f80ed;--g:#27ae60;--p:#e91e8c;--y:#ffd23f;--v:#8e44ad}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
input{user-select:text}
html,body{margin:0;height:100%;font-family:"Comic Sans MS","Chalkboard SE",sans-serif;background:#fff6d6;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:8px;padding:8px 0}
.top h1{flex:1;margin:0;font-size:22px;text-align:center;color:var(--v)}
.btn{border:0;border-radius:24px;color:#fff;font:inherit;font-weight:700;font-size:22px;padding:14px 18px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.menu{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 0 14px;align-content:center}
.menu .btn{font-size:26px;min-height:20vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.menu .btn span{font-size:54px}
.card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:0;text-align:center}
.big{font-size:min(38vw,170px);font-weight:900;line-height:1;letter-spacing:4px}
.pic{font-size:min(28vw,120px);line-height:1}
.cnt{font-size:min(11vw,48px);line-height:1.2;word-break:break-all}
.word{font-size:min(10vw,44px);font-weight:700;color:#555}
.im{max-height:28vh;max-width:70%;border-radius:20px;border:4px solid var(--y)}
.msg{font-size:26px;text-align:center;color:#555;padding:20px}
.in{font:inherit;font-size:28px;padding:10px;border-radius:14px;border:3px solid #ccc;width:70%;text-align:center}
.nav{display:flex;gap:10px;justify-content:center;padding:10px 0 14px}
.nav .btn{font-size:30px;flex:1}
.cv{flex:1;min-height:0;background:#fff;border-radius:24px;border:4px solid var(--y)}
canvas{touch-action:none;display:block;border-radius:20px}
.opts{display:flex;gap:12px;width:100%;padding:0 4px}
.opts .btn{flex:1;font-size:min(14vw,60px);padding:18px 4px}
.tabs{display:flex;gap:6px}
.tab{flex:1;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;background:#ddd}
.tab.on{background:var(--o);color:#fff}
.list{flex:1;overflow:auto}
.row{display:flex;gap:8px;align-items:center;background:#fff;border-radius:14px;margin:6px 0;padding:8px;font-size:20px}
.row span{flex:1}
.row button{font-size:22px;border:0;background:#eee;border-radius:10px;padding:8px}
.set{font-size:16px;padding:6px 0}.set input{width:100%}
.form{display:flex;flex-direction:column;gap:8px;overflow:auto;padding-bottom:12px}
.form label{font-size:16px;font-weight:700;display:flex;flex-direction:column;gap:3px}
.form input,.form select{font:inherit;font-size:20px;padding:10px;border-radius:12px;border:2px solid #ccc}
#fx{position:fixed;inset:0;pointer-events:none;display:flex;flex-wrap:wrap;font-size:48px;justify-content:space-around;align-content:space-around;animation:pop 1.2s forwards}
@keyframes pop{0%{opacity:0;transform:scale(.5)}20%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.3)}}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
</style></head><body><div id="app"></div>
<script>
const COL=['#e74c3c','#ff8a00','#f1c40f','#27ae60','#2f80ed','#8e44ad','#e91e8c'];
const DH=[['A','Apel','🍎'],['B','Bola','⚽'],['C','Cabai','🌶️'],['D','Domba','🐑'],['E','Es krim','🍦'],['F','Foto','📷'],['G','Gajah','🐘'],['H','Harimau','🐯'],['I','Ikan','🐟'],['J','Jeruk','🍊'],['K','Kucing','🐱'],['L','Lebah','🐝'],['M','Mobil','🚗'],['N','Nanas','🍍'],['O','Odong-odong','🎠'],['P','Pisang','🍌'],['Q','Quran','📖'],['R','Rumah','🏠'],['S','Sapi','🐮'],['T','Topi','🎩'],['U','Ular','🐍'],['V','Vas','🏺'],['W','Wortel','🥕'],['X','Xilofon','🎹'],['Y','Yoyo','🪀'],['Z','Zebra','🦓']];
const DW=['Nol','Satu','Dua','Tiga','Empat','Lima','Enam','Tujuh','Delapan','Sembilan'];
const DE=['⭐','🍎','🐥','🎈','🍓','🐟','🚗','🌸','🍪','🦋'];
const A=document.getElementById('app'),$=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert('Penyimpanan penuh, hapus foto yang besar.')}};
let uid=0;const nid=()=>Date.now().toString(36)+(uid++);
function defaults(){return DH.map(([t,w,e])=>({id:nid(),k:'huruf',t,w,e})).concat(DW.map((w,i)=>({id:nid(),k:'angka',t:''+i,w,e:DE[i]})))}
let items=ld('bb_items',null)||defaults();sv('bb_items',items);
let SET=ld('bb_set',{pitch:1.7,rate:.85}),S={},SC=0;
const list=k=>items.filter(x=>x.k===k);
const col=t=>String(t).split('').map((c,i)=>`<span style="color:${COL[i%7]}">${esc(c)}</span>`).join('');
const say=it=>it.s||(it.k==='huruf'?`${it.t}. ${it.t} untuk ${it.w}`:it.k==='angka'?(it.w||it.t):(it.w?`${it.t}. ${it.w}`:it.t));
function speak(t){try{const T=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.TextToSpeech;if(T){T.speak({text:t,lang:'id-ID',rate:SET.rate,pitch:SET.pitch,volume:1}).catch(()=>{});return}}catch(e){}
if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='id-ID';u.pitch=SET.pitch;u.rate=SET.rate;speechSynthesis.speak(u)}}
function cheer(){const d=document.createElement('div');d.id='fx';d.textContent='🎉⭐🌈🎈🌟🎊🦄🎉⭐🌈🎈🌟';document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
const bar=(t,b)=>`<div class="top"><button class="btn" style="background:var(--p)" onclick="${b||"go('home')"}">🏠</button><h1>${t}</h1></div>`;
function go(n,a){S=a||{};({home,learn,trace,quiz,gate,admin})[n]()}
const pic=it=>it.img?`<img class="im" src="${it.img}">`:(it.e?`<div class="pic">${esc(it.e)}</div>`:'');

function home(){A.innerHTML=`<div class="top"><h1>🌈 SANDI AYO BELAJAR 🌈</h1></div><div class="menu">${[['Huruf','🔤','#e74c3c',"go('learn',{k:'huruf'})"],['Angka','🔢','#2f80ed',"go('learn',{k:'angka'})"],['Menulis','✏️','#27ae60',"go('trace')"],['Kuis','🎯','#e91e8c',"go('quiz')"],['Tulisanku','🌈','#8e44ad',"go('learn',{k:'tulisan'})"],['Orang Tua','👨‍👩‍👧','#ff8a00',"go('gate')"]].map(([t,e,c,f])=>`<button class="btn" style="background:${c}" onclick="speak('${t}');${f}"><span>${e}</span>${t}</button>`).join('')}</div>`}

function learn(){const L=list(S.k);if(!L.length){A.innerHTML=bar('Kosong')+`<p class="msg">Belum ada data. Minta orang tua menambahkan di menu Orang Tua.</p>`;return}
S.L=L;S.i=((S.i||0)+L.length)%L.length;const it=L[S.i],n=+it.t;
A.innerHTML=bar({huruf:'Huruf',angka:'Angka',tulisan:'Tulisanku'}[S.k])+`<div class="card" onclick="speak(say(S.L[S.i]))"><div class="big">${col(it.t)}</div>${S.k==='angka'&&n>0&&n<=10&&it.e&&!it.img?`<div class="cnt">${esc(it.e).repeat(n)}</div>`:pic(it)}<div class="word">${esc(it.w)}</div></div><div class="nav"><button class="btn" style="background:var(--b)" onclick="S.i--;learn()">◀</button><button class="btn" style="background:var(--o)" onclick="speak(say(S.L[S.i]))">🔊</button><button class="btn" style="background:var(--g)" onclick="S.i++;learn()">▶</button></div>`;speak(say(it))}

function trace(){const L=items.filter(x=>x.t&&x.t.length<=12);if(!L.length){go('home');return}
S.L=L;S.i=((S.i||0)+L.length)%L.length;
A.innerHTML=bar('Menulis')+`<div class="cv"><canvas id="c"></canvas></div><div class="nav"><button class="btn" style="background:var(--b)" onclick="S.i--;trace()">◀</button><button class="btn" style="background:#e74c3c" onclick="clr()">🗑️</button><button class="btn" style="background:var(--o)" onclick="speak('Hebat! Kamu pintar!');cheer()">✅</button><button class="btn" style="background:var(--g)" onclick="S.i++;trace()">▶</button></div>`;
setTimeout(initC,60);speak('Ayo tulis '+S.L[S.i].t)}
function initC(){const c=$('#c');if(!c)return;const p=c.parentNode,r=window.devicePixelRatio||1,w=p.clientWidth-8,h=p.clientHeight-8;
c.width=w*r;c.height=h*r;c.style.width=w+'px';c.style.height=h+'px';const x=c.getContext('2d');x.scale(r,r);
const t=S.L[S.i].t,fs=Math.min(h*.85,w/(t.length*.62));x.font=`900 ${fs}px "Comic Sans MS",sans-serif`;x.textAlign='center';x.textBaseline='middle';
x.fillStyle='#ececec';x.fillText(t,w/2,h/2);x.setLineDash([10,10]);x.lineWidth=3;x.strokeStyle='#aaa';x.strokeText(t,w/2,h/2);x.setLineDash([]);
S.g=x.getImageData(0,0,c.width,c.height);S.x=x;let d=false,hue=0,lx,ly;
c.onpointerdown=e=>{d=true;lx=e.offsetX;ly=e.offsetY;c.setPointerCapture(e.pointerId)};
c.onpointermove=e=>{if(!d)return;x.lineCap='round';x.lineJoin='round';x.lineWidth=Math.max(14,w/18);x.strokeStyle=`hsl(${hue},90%,50%)`;hue=(hue+5)%360;x.beginPath();x.moveTo(lx,ly);x.lineTo(e.offsetX,e.offsetY);x.stroke();lx=e.offsetX;ly=e.offsetY};
c.onpointerup=c.onpointercancel=()=>{d=false}}
function clr(){S.x.putImageData(S.g,0,0)}

function quiz(){const P=items.filter(x=>x.t);if(P.length<3){go('home');return}
const sh=a=>a.slice().sort(()=>Math.random()-.5),q=P[Math.random()*P.length|0],n=+q.t,cnt=q.k==='angka'&&n>0&&n<=10&&q.e&&!q.img;
let pool=sh(P.filter(x=>x.k===q.k&&x.t!==q.t));if(pool.length<2)pool=sh(P.filter(x=>x.t!==q.t));
const o=sh([q].concat(pool.slice(0,2)));S.q=q;
const ask=cnt?'Ada berapa?':`Mana ${q.k==='huruf'?'huruf ':q.k==='angka'?'angka ':''}${q.k==='angka'?(q.w||q.t):q.t}?`;
A.innerHTML=bar('Kuis ⭐'+SC)+`<div class="card"><div class="word" style="color:var(--v)">${esc(ask)}</div>${cnt?`<div class="cnt">${esc(q.e).repeat(n)}</div>`:pic(q)}</div><div class="opts">${o.map((x,i)=>`<button class="btn" style="background:${COL[(i*2+1)%7]}" onclick="ans('${x.id}',this)">${esc(x.t)}</button>`).join('')}</div><div style="height:18px"></div>`;
speak(ask)}
function ans(i,b){if(i===S.q.id){SC++;cheer();speak('Hebat! Benar!');setTimeout(()=>{if($('.opts'))quiz()},1700)}else{b.classList.add('shake');speak('Coba lagi ya');setTimeout(()=>b.classList.remove('shake'),450)}}

function gate(){const a=2+Math.random()*8|0,b=2+Math.random()*8|0;S={r:a+b};
A.innerHTML=bar('Khusus Orang Tua')+`<div class="card"><p class="msg">Jawab dulu: ${a} + ${b} = ?</p><input id="ga" class="in" type="number" inputmode="numeric"><button class="btn" style="background:var(--g)" onclick="+$('#ga').value===S.r?go('admin'):go('home')">Masuk</button></div>`}

function admin(){S.f=S.f||'huruf';const L=list(S.f);
A.innerHTML=bar('Pengaturan')+`<div class="tabs">${['huruf','angka','tulisan'].map(k=>`<button class="tab ${k===S.f?'on':''}" onclick="S.f='${k}';admin()">${k}</button>`).join('')}</div><div class="list">${L.map(it=>`<div class="row"><b>${esc(it.t)}</b><span>${it.img?'🖼️':esc(it.e)} ${esc(it.w)}</span><button onclick="edit('${it.id}')">✏️</button><button onclick="del('${it.id}')">🗑️</button></div>`).join('')||'<p class="msg">Belum ada. Tekan Tambah.</p>'}</div>
<button class="btn" style="background:var(--g);margin:6px 0" onclick="edit('')">➕ Tambah ${S.f}</button>
<div class="set">Nada suara (tinggi = suara anak)<input type="range" min="0.5" max="2" step="0.1" value="${SET.pitch}" oninput="SET.pitch=+this.value;sv('bb_set',SET)"> Kecepatan<input type="range" min="0.5" max="1.5" step="0.05" value="${SET.rate}" oninput="SET.rate=+this.value;sv('bb_set',SET)"></div>
<div style="display:flex;gap:8px;padding-bottom:10px"><button class="btn" style="flex:1;background:var(--b);font-size:16px" onclick="speak('Halo teman, ayo belajar bersama!')">🔊 Tes suara</button><button class="btn" style="flex:1;background:#999;font-size:16px" onclick="if(S.rc){items=defaults();sv('bb_items',items);S.rc=0;admin()}else{S.rc=1;this.textContent='Yakin? Tekan lagi'}">↩️ Reset data</button></div>`}
function del(i){items=items.filter(x=>x.id!==i);sv('bb_items',items);admin()}
function edit(i){const f=S.f,it=items.find(x=>x.id===i)||{k:f,t:'',w:'',e:'',s:''};S.cur=i;S.img=it.img||'';
A.innerHTML=bar('Isi Data',`go('admin',{f:'${f}'})`)+`<div class="form"><label>Jenis<select id="fk">${['huruf','angka','tulisan'].map(k=>`<option ${k===it.k?'selected':''}>${k}</option>`).join('')}</select></label>
<label>Tulisan yang ditiru anak (huruf, angka, atau kata)<input id="ft" value="${esc(it.t)}"></label>
<label>Nama gambar / kata<input id="fw" value="${esc(it.w)}"></label>
<label>Emoji gambar (contoh 🍎)<input id="fe" value="${esc(it.e)}"></label>
<label>Atau foto sendiri<input type="file" accept="image/*" onchange="pick(this)"></label>
<label>Ucapan khusus (boleh kosong)<input id="fs" value="${esc(it.s)}"></label>
<button class="btn" style="background:var(--g)" onclick="save()">💾 Simpan</button></div>`}
function pick(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=320,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.img=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)}
function save(){const t=$('#ft').value.trim();if(!t){alert('Isi tulisan dulu');return}
const o={id:S.cur||nid(),k:$('#fk').value,t,w:$('#fw').value.trim(),e:$('#fe').value.trim(),s:$('#fs').value.trim()};if(S.img)o.img=S.img;
const j=items.findIndex(x=>x.id===S.cur);j>=0?items[j]=o:items.push(o);sv('bb_items',items);go('admin',{f:o.k})}
home();
</script></body></html>
